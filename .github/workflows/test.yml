name: test

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, xpbd-body-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: npm run eval
